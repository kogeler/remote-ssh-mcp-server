version: 2
updates:
  # The manifests own direct versions and pip-compile owns the generated locks.
  # Group ordinary updates so one resolver change produces one coherent PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Pydantic pins an exact pydantic-core build. Dependabot treats the
    # transitive pip-compile lock entry as direct and otherwise repeatedly opens
    # an uninstallable core-only update. Core moves through a pydantic update or
    # an intentional `make refresh-dependencies`, never independently.
    ignore:
      - dependency-name: pydantic-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
