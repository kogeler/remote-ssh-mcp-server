version: 2
updates:
  # Both lock files are pip-compile output. Dependabot recognises the header
  # pip-compile writes, so it recompiles the whole tree from pyproject.toml
  # instead of editing one pinned line, and its pull requests stay resolvable.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
