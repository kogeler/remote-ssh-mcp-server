name: Dependabot freeze

# Dependabot edits a single pinned line. requirements.txt is generated output,
# so a single line is almost never a coherent tree: bumping a direct dependency
# leaves its exact transitive pins behind. This workflow rebuilds the freeze
# from pyproject.toml and pushes the coherent result onto the same branch.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependabot-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  refresh:
    name: Refresh dependency freeze
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Rebuild the freeze from pyproject.toml
        run: make refresh-dependencies

      # Re-running this on an already coherent branch changes nothing and
      # pushes nothing, so an upgraded push token cannot cause a loop.
      - name: Push the regenerated freeze
        env:
          # A Dependabot secret named DEPENDABOT_PUSH_TOKEN makes the pushed
          # commit start a new CI run. The default token deliberately cannot.
          PUSH_TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN || github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- requirements.txt; then
            printf '%s\n' 'The freeze already matches pyproject.toml.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- requirements.txt
          git commit --message 'Regenerate the dependency freeze'
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:${HEAD_BRANCH}"

          {
            printf '%s\n\n' '### Regenerated the dependency freeze'
            printf '%s\n' 'Dependabot changed one pinned line; the freeze was'
            printf '%s\n' 'rebuilt from pyproject.toml and pushed.'
          } >> "$GITHUB_STEP_SUMMARY"
