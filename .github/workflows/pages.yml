name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "doc/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-docs.txt"
      - "tools/audit_docs_site.py"
      - "tests/test_docs_site_audit.py"
      - "Makefile"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-docs.txt"
      - "tools/audit_docs_site.py"
      - "tests/test_docs_site_audit.py"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-ssh-mcp-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Render and audit site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build current documentation and validate every local route
        run: make docs-audit SYSTEM_PYTHON=python
      - name: Preserve the rendered Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the audited site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
