name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      base_ref:
        description: Exact base commit for version progression.
        required: false
        type: string
        default: ""
      upload_release_artifacts:
        description: Preserve the verified standalone release candidates.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Tests, linters, and Python compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt
            requirements-docs.in
            requirements-docs.txt
            requirements-lint.in
            requirements-lint.txt

      - name: Run complete project contract
        run: make ci

  standalone:
    name: Linux ${{ matrix.architecture }} standalone
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-standalone.in
            requirements-standalone.txt
      - name: Build and smoke the native executable
        run: >-
          make standalone smoke-standalone SYSTEM_PYTHON=python
          STANDALONE_ARCH=${{ matrix.architecture }}
      - name: Preserve exact standalone release candidate
        if: inputs.upload_release_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.architecture }}
          path: dist/remote-ssh-mcp-linux-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          config-file: ./.github/dependency-review-config.yml

  # Ordinary changes may retain a published version while Unreleased accumulates.
  # An unpublished current version still has to advance beyond published history.
  version:
    name: Exact version progression
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha || github.event.before }}
      ZERO_SHA: "0000000000000000000000000000000000000000"
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve exact published and base versions
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_REPOSITORY: kogeler/remote-ssh-mcp-server
          VERSION_PATH: .version
        with:
          script: |
            const fs = await import("node:fs/promises");
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== process.env.EXPECTED_REPOSITORY) {
              throw new Error(`Refusing to inspect unexpected repository ${repository}`);
            }
            const current = (await fs.readFile(process.env.VERSION_PATH, "utf8")).trim();
            const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!stable.test(current)) throw new Error(".version is not stable X.Y.Z");

            let base = "0.0.0";
            const baseRef = process.env.BASE_REF;
            if (baseRef && baseRef !== process.env.ZERO_SHA) {
              const response = await github.rest.repos.getContent({
                ...context.repo,
                path: ".version",
                ref: baseRef,
              });
              if (
                Array.isArray(response.data) || response.data.type !== "file" ||
                response.data.encoding !== "base64" ||
                typeof response.data.content !== "string"
              ) {
                throw new Error("base .version is not a Base64 repository file");
              }
              base = Buffer.from(
                response.data.content.replace(/\n/g, ""),
                "base64",
              ).toString("utf8").trim();
            }
            if (!stable.test(base)) throw new Error("base version is not stable X.Y.Z");

            let publishedCurrent = false;
            let unpublished = "";
            try {
              const currentRelease = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: current,
              });
              publishedCurrent = currentRelease.data.tag_name === current &&
                !currentRelease.data.draft && !currentRelease.data.prerelease;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!publishedCurrent) {
              unpublished = "0.0.0";
              try {
                const latest = await github.rest.repos.getLatestRelease({ ...context.repo });
                unpublished = latest.data.tag_name;
              } catch (latestError) {
                if (latestError.status !== 404) throw latestError;
              }
              if (!stable.test(unpublished)) {
                throw new Error("latest release is not a stable X.Y.Z tag");
              }
            }
            core.setOutput("base_version", base);
            core.setOutput("published_current_version", String(publishedCurrent));
            core.setOutput("unpublished_base_version", unpublished);
      - name: Compare exact base and proposed versions
        env:
          BASE_VERSION: ${{ steps.baseline.outputs.base_version }}
          PUBLISHED_CURRENT_VERSION: ${{ steps.baseline.outputs.published_current_version }}
          UNPUBLISHED_BASE_VERSION: ${{ steps.baseline.outputs.unpublished_base_version }}
        run: |
          current_version="$(tr -d '\r\n' < .version)"
          args=""
          if [[ "$current_version" != "$BASE_VERSION" ]]; then
            args="--base-version $BASE_VERSION"
          elif [[ "$PUBLISHED_CURRENT_VERSION" != "true" ]]; then
            args="--base-version $BASE_VERSION --unpublished-base-version $UNPUBLISHED_BASE_VERSION"
          fi
          make version-check SYSTEM_PYTHON=python VERSION_ARGS="$args"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  live:
    name: Live Podman
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify rootless Podman
        run: make doctor
      - name: Install runtime explicitly
        run: make runtime-venv
      - name: Exercise the real isolated launcher
        run: make host-tests
      - name: Run automatic MCP live matrix
        run: make live-test
