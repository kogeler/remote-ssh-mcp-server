name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, test, and audit
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bootstrap pinned dependencies
        run: make venv

      # GITHUB_ACTIONS is already set for the mypy annotation filter; Ruff needs
      # its own renderer selected explicitly.
      - name: Run local CI matrix
        env:
          RUFF_OUTPUT_FORMAT: github
        run: make ci

      - name: Publish the coverage report
        if: ${{ !cancelled() }}
        env:
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          if [[ ! -f .coverage ]]; then
            printf '%s\n' 'Coverage data was not produced by this run.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            make coverage-report
            printf '\n<sub>Commit %s · reproduce with: make test && make coverage-report</sub>\n' \
              "${REPORT_SHA:0:7}"
          } | tee coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # Fork pull requests receive a read-only token whatever this job requests,
      # so a rejected comment must never mask the real quality-gate result.
      - name: Comment the coverage report on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -f coverage-report.md ]]; then
            .github/scripts/pr-comment.sh coverage coverage-report.md
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          # The action downgrades an unwritable pull request to a warning, so
          # this never turns a clean dependency result into a failed check.
          comment-summary-in-pr: always

  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:python

  live-lxc:
    name: Live LXC
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync
          if ! snap list lxd >/dev/null 2>&1; then
            sudo snap install lxd
          fi
          sudo /snap/bin/lxd waitready
          if ! sudo /snap/bin/lxc storage show default >/dev/null 2>&1; then
            sudo /snap/bin/lxd init --minimal
          fi
          sudo usermod --append --groups lxd "$USER"

      # The runner image ships a running Docker daemon, which sets the FORWARD
      # policy to DROP. Bridged LXD traffic is forwarded, so without this the
      # test instance still resolves names through the bridge but cannot reach
      # any archive, and provisioning fails on apt.
      - name: Allow LXD bridge traffic through the host firewall
        run: |
          if ! ip link show lxdbr0 >/dev/null 2>&1; then
            printf '%s\n' 'lxdbr0 is missing; LXD did not create its bridge.' >&2
            exit 1
          fi
          if sudo iptables --numeric --list DOCKER-USER >/dev/null 2>&1; then
            sudo iptables --insert DOCKER-USER --in-interface lxdbr0 --jump ACCEPT
            sudo iptables --insert DOCKER-USER --out-interface lxdbr0 \
              --match conntrack --ctstate RELATED,ESTABLISHED --jump ACCEPT
          fi
          sudo iptables --policy FORWARD ACCEPT
          sudo iptables --list-rules FORWARD

      - name: Bootstrap pinned dependencies
        run: make venv

      - name: Run automatic live test
        run: sg lxd -c "PATH=/snap/bin:$PATH make live-test"
