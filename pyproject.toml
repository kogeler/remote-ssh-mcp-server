[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-ssh-mcp"
version = "0.2.0"
description = "Bounded remote-machine tools for MCP clients over one OpenSSH master"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
remote-ssh-mcp = "remote_ssh_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["remote_ssh_mcp*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.mypy]
files = ["remote_ssh_mcp", "remote-ssh-mcp.py"]
python_version = "3.13"
strict = true

[tool.bandit]
exclude_dirs = ["tests", "venv-runtime", "venv-dev", "venv-lint", "venv-docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["remote_ssh_mcp"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
