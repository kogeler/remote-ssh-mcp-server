[pytest]
addopts = -n auto --dist=worksteal --cov --cov-report=term --cov-report=xml
	-m 'not host'
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
	host: needs the host itself - Podman on the machine, or a real launcher
		bootstrap. Deselected by default because the ordinary suite runs inside
		a container, where neither is available or meaningful. The live test
		runs these with -m host.
